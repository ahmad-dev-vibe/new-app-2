<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Professional News</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #FFC107; --bg: #f8f9fa; --text: #1a1a1a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); }

        /* Header */
        header { background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.08); sticky; top: 0; z-index: 1000; padding: 15px 0; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
        .logo { font-size: 28px; font-weight: 800; text-decoration: none; color: #000; }
        .logo span { background: var(--primary); padding: 2px 10px; border-radius: 8px; }

        .search-box { flex: 1; max-width: 500px; position: relative; }
        .search-box input { width: 100%; padding: 12px 20px; border-radius: 50px; border: 2px solid #eee; outline: none; }
        .search-box button { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: var(--primary); border: none; padding: 8px 15px; border-radius: 40px; font-weight: bold; cursor: pointer; }

        /* Categories */
        .cat-bar { background: #fff; border-top: 1px solid #f0f0f0; padding: 10px 0; overflow-x: auto; white-space: nowrap; }
        .cat-wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 10px; }
        .cat-btn { padding: 8px 18px; border-radius: 20px; border: none; background: #f0f0f0; cursor: pointer; font-weight: 600; font-size: 14px; }
        .cat-btn.active { background: var(--primary); }

        /* News Grid */
        main { max-width: 1200px; margin: 30px auto; padding: 0 20px; min-height: 50vh; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }

        .card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-body { padding: 20px; flex: 1; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
        .card-meta { font-size: 12px; color: #888; margin-bottom: 10px; font-weight: 600; color: var(--primary); }
        .btn-link { display: inline-block; margin-top: 15px; color: #000; font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--primary); }

        /* Error/Loading States */
        #status-msg { grid-column: 1/-1; text-align: center; padding: 50px; }
        .loader { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 15px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* DEBUG PANEL - Asli wajha janne ke liye */
        #debug-panel { margin-top: 20px; padding: 15px; background: #ffeeee; border: 1px solid #ffcccc; border-radius: 10px; display: none; color: #d32f2f; font-size: 13px; text-align: left; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo"><span>NEX</span>ORA</a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Enter city, keyword or country...">
                <button onclick="handleSearch()">Search</button>
            </div>
        </div>
        <div class="cat-bar">
            <div class="cat-wrap">
                <button class="cat-btn active" onclick="changeCat('general', this)">Top News</button>
                <button class="cat-btn" onclick="changeCat('world', this)">World</button>
                <button class="cat-btn" onclick="changeCat('nation', this)">India</button>
                <button class="cat-btn" onclick="changeCat('technology', this)">Technology</button>
                <button class="cat-btn" onclick="changeCat('business', this)">Business</button>
                <button class="cat-btn" onclick="changeCat('sports', this)">Sports</button>
            </div>
        </div>
    </header>

    <main>
        <div id="status-msg">
            <div class="loader"></div>
            <p>Fetching latest news stories...</p>
        </div>

        <div class="news-grid" id="newsGrid"></div>

        <!-- Debugging section -->
        <div id="debug-panel">
            <strong>System Report:</strong> <span id="debug-text"></span>
        </div>
    </main>

    <script>
        const API_KEY = '61f89b2d30a914eeef029e24692d56bb';

        async function fetchNews(url) {
            const grid = document.getElementById('newsGrid');
            const status = document.getElementById('status-msg');
            const debug = document.getElementById('debug-panel');
            const debugText = document.getElementById('debug-text');

            grid.innerHTML = '';
            status.style.display = 'block';
            debug.style.display = 'none';

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(`API Error ${res.status}: ${data.errors ? data.errors[0] : 'Unauthorized Access'}`);
                }

                if (data.articles.length === 0) {
                    status.innerHTML = "<h3>No results found.</h3><p>Try different keywords.</p>";
                    return;
                }

                status.style.display = 'none';
                data.articles.forEach(article => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${article.image || 'https://via.placeholder.com/400x200'}" alt="img">
                        <div class="card-body">
                            <div class="card-meta">${article.source.name}</div>
                            <h3 class="card-title">${article.title}</h3>
                            <p style="font-size:14px; color:#666">${article.description ? article.description.slice(0, 100) : 'Read more details below...'}...</p>
                            <a href="${article.url}" target="_blank" class="btn-link">READ FULL STORY</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                status.style.display = 'none';
                debug.style.display = 'block';
                debugText.innerText = err.message;
                
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:30px; background:#fff; border-radius:15px;">
                        <i class="fas fa-exclamation-triangle" style="font-size:40px; color:#FFC107;"></i>
                        <h2 style="margin-top:15px;">Unable to Connect</h2>
                        <p style="color:#666; margin-top:10px;">Common causes: <br> 1. Ad-blocker blocking 'gnews.io' <br> 2. API Key still activating (needs 60 mins) <br> 3. Daily limit reached.</p>
                        <button onclick="location.reload()" style="margin-top:15px; padding:10px 20px; background:var(--primary); border:none; font-weight:bold; cursor:pointer; border-radius:5px;">TRY REFRESHING</button>
                    </div>
                `;
            }
        }

        function handleSearch() {
            const q = document.getElementById('searchInput').value;
            if(q) fetchNews(`https://gnews.io/api/v4/search?q=${q}&lang=en&apikey=${API_KEY}`);
        }

        function changeCat(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchNews(`https://gnews.io/api/v4/top-headlines?category=${cat}&lang=en&apikey=${API_KEY}`);
        }

        document.getElementById('searchInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleSearch(); });

        // Initial Load
        window.onload = () => fetchNews(`https://gnews.io/api/v4/top-headlines?category=general&lang=en&apikey=${API_KEY}`);
    </script>
</body>
</html>
