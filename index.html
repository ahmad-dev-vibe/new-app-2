<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Premium News App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FFC107;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #2d3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg); color: var(--text); }

        /* --- UI Components --- */
        header { background: var(--white); box-shadow: 0 2px 20px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
        
        .logo { font-size: 28px; font-weight: 800; text-decoration: none; color: #000; }
        .logo span { background: var(--primary); padding: 2px 10px; border-radius: 8px; margin-right: 5px; }

        .search-box { flex: 1; max-width: 500px; position: relative; }
        .search-box input { width: 100%; padding: 12px 25px; border-radius: 50px; border: 2px solid #eee; outline: none; font-size: 14px; transition: 0.3s; }
        .search-box input:focus { border-color: var(--primary); }
        .search-box button { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: var(--primary); border: none; padding: 8px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; }

        .categories { background: #fff; border-top: 1px solid #f0f0f0; padding: 12px 0; overflow-x: auto; white-space: nowrap; }
        .cat-wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 12px; }
        .cat-btn { padding: 8px 20px; border-radius: 30px; border: none; background: #f0f0f0; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .cat-btn.active, .cat-btn:hover { background: var(--primary); transform: translateY(-2px); }

        main { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }

        /* --- Card Design --- */
        .card { background: var(--white); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.4s; display: flex; flex-direction: column; height: 100%; }
        .card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .card-img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .card-content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .card-tag { font-size: 11px; font-weight: 800; color: #ff9f43; text-transform: uppercase; margin-bottom: 10px; display: block; }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; line-height: 1.4; color: #1e272e; }
        .card-text { font-size: 14px; color: #57606f; line-height: 1.6; margin-bottom: 20px; }
        .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 600; padding-top: 15px; border-top: 1px solid #f1f2f6; }
        .read-btn { color: #000; text-decoration: none; background: var(--primary); padding: 5px 12px; border-radius: 5px; }

        /* --- Feedback States --- */
        #loading { display: none; text-align: center; padding: 100px 0; grid-column: 1/-1; }
        .loader-spin { width: 50px; height: 50px; border: 5px solid #eee; border-top: 5px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .error-msg { grid-column: 1/-1; background: #fff; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .error-msg i { font-size: 50px; color: #ff4757; margin-bottom: 20px; }
        
        @media (max-width: 768px) {
            .nav-container { justify-content: center; }
            .search-box { min-width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="#" class="logo" onclick="location.reload()"><span>NEX</span>ORA</a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search news, topics or locations...">
                <button onclick="performSearch()">Search</button>
            </div>
        </div>
        <div class="categories">
            <div class="cat-wrap">
                <button class="cat-btn active" onclick="loadCategory('general', this)">Trending</button>
                <button class="cat-btn" onclick="loadCategory('world', this)">World</button>
                <button class="cat-btn" onclick="loadCategory('business', this)">Business</button>
                <button class="cat-btn" onclick="loadCategory('technology', this)">Tech</button>
                <button class="cat-btn" onclick="loadCategory('sports', this)">Sports</button>
                <button class="cat-btn" onclick="loadCategory('science', this)">Science</button>
            </div>
        </div>
    </header>

    <main>
        <div id="loading">
            <div class="loader-spin"></div>
            <p style="margin-top: 15px; font-weight: 600;">Connecting to Nexora Servers...</p>
        </div>
        <div class="news-grid" id="newsGrid"></div>
    </main>

    <script>
        const API_KEY = '61f89b2d30a914eeef029e24692d56bb';

        // Base function to fetch data
        async function fetchNexoraNews(endpoint) {
            const grid = document.getElementById('newsGrid');
            const loader = document.getElementById('loading');
            
            grid.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch(endpoint);
                const data = await response.json();

                if (!response.ok) {
                    // API specifically returned an error
                    let errorMsg = data.errors ? data.errors[0] : "API Limit Exceeded or Key Inactive.";
                    throw new Error(errorMsg);
                }

                if (data.articles && data.articles.length > 0) {
                    renderArticles(data.articles);
                } else {
                    throw new Error("No articles found for this search.");
                }

            } catch (err) {
                grid.innerHTML = `
                    <div class="error-msg">
                        <i class="fas fa-exclamation-circle"></i>
                        <h2>Status Update</h2>
                        <p style="margin: 15px 0; color: #666;">${err.message}</p>
                        <p style="font-size: 13px; color: #999;">Tip: GNews keys take 30-60 mins to activate for first-time use. <br> If you just created the key, please wait a while.</p>
                        <button onclick="location.reload()" style="margin-top:20px; padding: 10px 25px; cursor:pointer; background: #FFC107; border:none; border-radius:5px; font-weight:bold;">Retry Connection</button>
                    </div>
                `;
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderArticles(articles) {
            const grid = document.getElementById('newsGrid');
            articles.forEach(art => {
                const card = document.createElement('div');
                card.className = 'card';
                const date = new Date(art.publishedAt).toLocaleDateString('en-GB');
                
                card.innerHTML = `
                    <img class="card-img" src="${art.image || 'https://via.placeholder.com/400x220?text=Nexora+News'}" alt="news" onerror="this.src='https://via.placeholder.com/400x220?text=Image+Not+Available'">
                    <div class="card-content">
                        <span class="card-tag">${art.source.name}</span>
                        <h3 class="card-title">${art.title}</h3>
                        <p class="card-text">${art.description ? art.description.substring(0, 100) + '...' : 'Full details available in the main story.'}</p>
                        <div class="card-footer">
                            <span><i class="far fa-calendar-alt"></i> ${date}</span>
                            <a href="${art.url}" target="_blank" class="read-btn">Read More</a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function loadCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const url = `https://gnews.io/api/v4/top-headlines?category=${cat}&lang=en&apikey=${API_KEY}`;
            fetchNexoraNews(url);
        }

        function performSearch() {
            const q = document.getElementById('searchInput').value;
            if (q.trim() !== "") {
                const url = `https://gnews.io/api/v4/search?q=${q}&lang=en&apikey=${API_KEY}`;
                fetchNexoraNews(url);
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            }
        }

        // Search on Enter Key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Initialize on Load
        window.onload = () => {
            const initialUrl = `https://gnews.io/api/v4/top-headlines?category=general&lang=en&apikey=${API_KEY}`;
            fetchNexoraNews(initialUrl);
        };
    </script>
</body>
</html>
