<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Premium Real-time News</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FFC107;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-light: #6c757d;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); }

        header { background: var(--card-bg); box-shadow: var(--shadow); position: sticky; top: 0; z-index: 1000; padding: 15px 0; }
        .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; flex-wrap: wrap; }
        
        .logo { font-size: 26px; font-weight: 800; text-decoration: none; color: #000; display: flex; align-items: center; }
        .logo span { background: var(--primary); padding: 2px 8px; border-radius: 6px; margin-right: 5px; }

        .search-box { flex: 1; max-width: 500px; position: relative; min-width: 250px; }
        .search-box input { width: 100%; padding: 12px 20px; border-radius: 50px; border: 2px solid #eee; outline: none; font-size: 14px; }
        .search-box button { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: var(--primary); border: none; padding: 8px 15px; border-radius: 40px; font-weight: bold; cursor: pointer; }

        .category-bar { background: #fff; border-bottom: 1px solid #eee; padding: 10px 0; overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .category-wrapper { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 10px; }
        .cat-item { padding: 6px 18px; background: #f0f0f0; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
        .cat-item.active { background: var(--primary); box-shadow: 0 4px 8px rgba(255,193,7,0.4); }

        main { max-width: 1200px; margin: 30px auto; padding: 0 20px; min-height: 60vh; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }

        .news-card { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: var(--shadow); transition: 0.3s; display: flex; flex-direction: column; }
        .news-card:hover { transform: translateY(-5px); }
        .img-container { width: 100%; height: 180px; background: #ddd; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }

        .card-body { padding: 15px; flex-grow: 1; }
        .news-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
        .news-desc { font-size: 14px; color: var(--text-light); line-height: 1.5; margin-bottom: 15px; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #f5f5f5; font-size: 12px; }
        .btn-read { color: #000; text-decoration: none; font-weight: 700; }

        #loader { display: none; text-align: center; padding: 50px; grid-column: 1/-1; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .error-box { grid-column: 1/-1; background: #fff1f1; border: 1px solid #ffa3a3; padding: 30px; border-radius: 12px; text-align: center; }
        .error-box h3 { color: #d32f2f; margin-bottom: 10px; }
        .error-box p { color: #555; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <nav class="nav-container">
            <a href="#" class="logo" onclick="location.reload()"><span>NEX</span>ORA</a>
            <div class="search-box">
                <input type="text" id="queryInput" placeholder="Search city or topic (e.g. Mumbai, Tech)...">
                <button onclick="handleSearch()">Search</button>
            </div>
        </nav>
        <div class="category-bar">
            <div class="category-wrapper">
                <button class="cat-item active" onclick="filterCategory('general', this)">Trending</button>
                <button class="cat-item" onclick="filterCategory('world', this)">World</button>
                <button class="cat-item" onclick="filterCategory('business', this)">Business</button>
                <button class="cat-item" onclick="filterCategory('technology', this)">Technology</button>
                <button class="cat-item" onclick="filterCategory('sports', this)">Sports</button>
                <button class="cat-item" onclick="filterCategory('entertainment', this)">Entertainment</button>
            </div>
        </div>
    </header>

    <main>
        <div class="news-grid" id="newsGrid"></div>
        <div id="loader">
            <div class="spinner"></div>
            <p>Loading Nexora News...</p>
        </div>
    </main>

    <script>
        // API Key (Make sure this key is active in your GNews dashboard)
        const API_KEY = '61f89b2d30a914eeef029e24692d56bb';

        async function fetchNews(url) {
            const newsGrid = document.getElementById('newsGrid');
            const loader = document.getElementById('loader');
            
            newsGrid.innerHTML = '';
            loader.style.display = 'block';

            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.errors ? errorData.errors[0] : "API Limit reached");
                }

                const data = await response.json();
                
                if (data.articles.length === 0) {
                    showError("No news found.", "Try searching for something else.");
                } else {
                    displayNews(data.articles);
                }
            } catch (error) {
                console.error(error);
                showError("Connection/Security Error", 
                    "Browser ne API call block kar di hai. <br><br><b>Solution:</b> Is file ko 'Live Server' (VS Code) me chalayein ya kisi hosting par upload karein. Direct HTML file open karne par ye error aata hai.");
            } finally {
                loader.style.display = 'none';
            }
        }

        function displayNews(articles) {
            const newsGrid = document.getElementById('newsGrid');
            articles.forEach(article => {
                const div = document.createElement('div');
                div.className = 'news-card';
                div.innerHTML = `
                    <div class="img-container">
                        <img src="${article.image || 'https://via.placeholder.com/400x200?text=Nexora+News'}" alt="news">
                    </div>
                    <div class="card-body">
                        <h3 class="news-title">${article.title}</h3>
                        <p class="news-desc">${article.description ? article.description.slice(0, 120) + '...' : 'Click read more to see full story.'}</p>
                        <div class="card-footer">
                            <span>${article.source.name}</span>
                            <a href="${article.url}" target="_blank" class="btn-read">Read More →</a>
                        </div>
                    </div>
                `;
                newsGrid.appendChild(div);
            });
        }

        function handleSearch() {
            const q = document.getElementById('queryInput').value;
            if(q) fetchNews(`https://gnews.io/api/v4/search?q=${q}&lang=en&apikey=${API_KEY}`);
        }

        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            fetchNews(`https://gnews.io/api/v4/top-headlines?category=${cat}&lang=en&apikey=${API_KEY}`);
        }

        function showError(title, msg) {
            document.getElementById('newsGrid').innerHTML = `
                <div class="error-box">
                    <i class="fas fa-exclamation-triangle" style="font-size:30px; color:red;"></i>
                    <h3>${title}</h3>
                    <p>${msg}</p>
                    <button onclick="location.reload()" style="margin-top:15px; padding:8px 15px; cursor:pointer;">Refresh Page</button>
                </div>
            `;
        }

        // Auto load trending on start
        window.onload = () => fetchNews(`https://gnews.io/api/v4/top-headlines?category=general&lang=en&apikey=${API_KEY}`);
    </script>
</body>
</html>
